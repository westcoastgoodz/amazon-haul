services:
  - type: web
    name: amazon-haul-monitor
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web_ui:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: ahm-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATA_DIR
        value: /var/data
      - key: KEEPA_API_KEY
        sync: false
      - key: DISCORD_WEBHOOK
        sync: false
      - key: CHANNEL_ENABLED_50
        value: "true"
      - key: CHANNEL_ENABLED_60
        value: "true"
      - key: CHANNEL_ENABLED_70
        value: "true"
      - key: CHANNEL_ENABLED_80
        value: "true"
      - key: KEEPA_DOMAIN
        value: "1"
      - key: PRICE_TYPE
        value: "1"
      - key: REFERENCE_DAYS
        value: "90"
      - key: KEEPA_BATCH_SIZE
        value: "40"
      - key: MAX_NEW_KEEPA_LOOKUPS
        value: "60"
      - key: KEEPA_CACHE_DAYS
        value: "7"
      - key: ROUTE_MODE
        value: highest
      - key: POLL_INTERVAL_SEC
        value: "600"
      - key: MIN_DISCOUNT
        value: "50"
      - key: MAX_DISCOUNT
        value: "95"
      - key: ALERT_COOLDOWN_HOURS
        value: "24"
      - key: NO_REPEAT_SAME_DAY
        value: "true"
      - key: ALLOW_CHEAPER_REPEAT
        value: "true"
      - key: MAX_ALERTS_PER_TIER
        value: "3"
      - key: MIN_ORIGINAL_PRICE
        value: "5"
      - key: MIN_HAUL_PRICE
        value: "1"
      - key: MAX_HAUL_PRICE
        value: "50"
      - key: MIN_SAVINGS
        value: "3"
      - key: MIN_TRACKING_DAYS
        value: "0"
      - key: REQUIRE_BRAND
        value: "false"
      - key: EXCLUDE_GENERIC_BRAND
        value: "false"
      - key: MIN_REVIEW_COUNT
        value: "0"
      - key: MIN_RATING
        value: "0"
      - key: SELLER_LABEL
        value: "Haul"
      - key: CHANNEL_PREFIX
        value: "Haul"
      - key: INCLUDE_GRAPH
        value: "true"
      - key: HAUL_PAGES
        value: "3"
      - key: HAUL_MAX_ITEMS
        value: "6000"
      - key: HAUL_REQUEST_DELAY
        value: "0.8"
      - key: HAUL_TIMEOUT_SEC
        value: "45"
      - key: HAUL_RETRIES
        value: "2"
      - key: PROXY_URL
        sync: false
      - key: HAUL_KEYWORDS
        value: "automotive,car accessories,car parts,auto parts,tools,home improvement,electronics,kitchen,office,pet supplies,sports and outdoors,industrial and scientific,garden,home and garden,furniture,lighting,hardware,appliances,computers,cell phones,beauty,health,motorcycle,ATV,boat,RV,truck,car audio,car electronics,car tools,garage,workshop,power tools,hand tools,plumbing,electrical,fasteners,adhesives,paint,lawn and garden,outdoor,patio,grill,pool,cleaning,storage,organization"
      - key: HAUL_CATEGORY_NODES
        value: "15684181,2972638011,228013,1055398,172282"
      - key: WATCHLIST_ASINS
        value: "B0G3VXR3QX,B0G42PX27P,B0G1C6X3MW,B0G5X14M3D"

      - key: EXCLUDE_CATEGORIES
        value: ""
      - key: EXCLUDE_BOOKS
        value: "false"
      - key: LOG_LEVEL
        value: "INFO"
